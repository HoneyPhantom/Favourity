name = "favourity"
main = "src/worker/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "favourity-db"
database_id = "342f38a9-b0ad-4746-b389-b17f899135e0"

# Cloudflare KV Binding
[[kv_namespaces]]
binding = "LEADERBOARD_KV"
id = "6264d9ee90d2449ea552025b406b6aa0"

# Cloudflare Cron Triggers:
# 1. "0 12 * * *"   : Daily 12:00 PM UTC batch aggregation
# 2. "0 0 * * SUN"  : Sunday 00:00 UTC weekly reset
[triggers]
crons = ["0 12 * * *", "0 0 * * SUN"]
